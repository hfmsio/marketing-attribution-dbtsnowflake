version: 2

models:
  - name: stg_ga4__event
    description: Staged GA4 events. One row per event with UTM parameters and device/geo dimensions.
    columns:
      - name: event_at
        description: Event timestamp
        tests:
          - not_null
      - name: user_pseudo_id
        description: GA4 anonymous cookie-based user ID
        tests:
          - not_null
      - name: event_name
        tests:
          - not_null
